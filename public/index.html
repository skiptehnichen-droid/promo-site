<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promo Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* Черный фон */
            color: #ff337a;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Верхний левый угол */
        .corner-left {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 12px;
            color: gray;
        }

        /* Нижний правый угол */
        .corner-right {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: gray;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .corner-right img {
                width: 24px;
                height: 24px;
                cursor: pointer;
            }

        .logo {
            margin-top: 60px;
            max-width: 200px;
        }

        .description {
            margin: 20px auto;
            font-size: 14px;
            line-height: 1.4;
            max-width: 300px;
        }

        .input-box {
            margin: 20px auto;
        }

        input[type="text"] {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ff337a;
            background: black;
            color: #ff337a;
            border-radius: 6px;
            width: 250px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin-left: 10px;
            font-size: 18px;
            border: 2px solid #ff337a;
            background: black;
            color: #ff337a;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.9);
            color: #ff337a;
            padding: 20px;
            border-radius: 20px;
            width: 80%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

            .modal-content h2 {
                margin: 0;
                font-size: 20px;
                text-align: center;
            }

            .modal-content img {
                max-width: 200px;
            }

        .modal-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

            .modal-buttons button {
                flex: 1;
            }
    </style>
</head>
<body>
    <!-- Верхний левый угол -->
    <div class="corner-left">prod.whatis®</div>

    <!-- Логотип -->
    <img src="logo.png" alt="Logo" class="logo">

    <!-- Текст -->
    <div class="description">
        here u can enter<br>
        ur code and get ur beat
    </div>

    <!-- Ввод кода -->
    <div class="input-box">
        <input type="text" id="codeInput" placeholder="enter code">
        <button onclick="checkCode()">OK</button>
    </div>

    <!-- Нижний правый угол -->
    <div class="corner-right">
        v01.02-01.10.25
        <a href="https://youtube.com/@wwhatiss?si=RI2H-aE_1BzdZcow" target="_blank">
            <img src="youtube.png" alt="YouTube">
        </a>
        <a href="https://www.instagram.com/prod.whatis?igsh=MW5pY3h4cWtmMXZpbA%3D%3D&utm_source=qr" target="_blank">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <img src="logo.png" alt="Beat Image">
            <div class="modal-buttons">
                <button id="downloadBtn">Download</button>
                <button onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        async function checkCode() {
            const code = document.getElementById("codeInput").value.trim();
            if (!code) return alert("Enter a code");

            const res = await fetch("/check?code=" + code);
            const data = await res.json();

            if (data.success) {
                document.getElementById("modalText").textContent = data.text;
                document.getElementById("downloadBtn").onclick = () => {
                    window.open(data.file, "_blank");
                };
                document.getElementById("modal").style.display = "flex";
            } else {
                alert("Invalid code!");
            }
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>
</body>
</html>
