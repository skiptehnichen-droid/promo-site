<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Promo Site</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color, #000000);
            color: var(--detail-color, #ff337a);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Лого */
        .logo {
            max-width: 80%;
            height: auto;
            margin-bottom: 10px;
        }

        /* Текст */
        .instruction {
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            color: var(--detail-color, #ff337a);
        }

        /* Контейнер для ввода и кнопки */
        .input-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }

            .input-container input {
                padding: 12px;
                font-size: 18px;
                border: 2px solid var(--detail-color, #ff337a);
                background: transparent;
                color: var(--detail-color, #ff337a);
                outline: none;
                border-radius: 8px;
                text-align: center;
                width: 100%;
                margin-bottom: 10px;
            }

            .input-container button {
                padding: 12px 20px;
                font-size: 18px;
                border: 2px solid var(--detail-color, #ff337a);
                background: transparent;
                color: var(--detail-color, #ff337a);
                border-radius: 8px;
                cursor: pointer;
                width: 100%;
            }

        /* ✅ Модальное окно */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .modal h2 {
            color: var(--detail-color, #ff337a);
            margin-bottom: 20px;
        }

        .modal img {
            max-width: 80%;
            margin-bottom: 20px;
        }

        .modal button {
            margin: 10px;
            padding: 10px 20px;
            border: 2px solid var(--detail-color, #ff337a);
            background: transparent;
            color: var(--detail-color, #ff337a);
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        /* Подписи */
        .footer-text {
            position: fixed;
            bottom: 5px;
            right: 10px;
            font-size: 12px;
            color: gray;
        }

        .brand-text {
            position: fixed;
            top: 5px;
            left: 10px;
            font-size: 14px;
            color: gray;
        }

        /* Соцсети */
        .socials {
            position: fixed;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }

            .socials img {
                width: 40px;
                height: 40px;
                cursor: pointer;
            }

        /* 📱 Мобильная версия */
        @media (max-width: 768px) {
            .logo {
                max-width: 90%;
            }

            .instruction {
                font-size: 16px;
            }

            .input-container {
                flex-direction: column;
            }

                .input-container button {
                    width: 100%;
                    margin-top: 10px;
                }
        }

        /* 💻 ПК версия */
        @media (min-width: 769px) {
            .logo {
                max-width: 300px;
            }

            .instruction {
                font-size: 20px;
            }

            .input-container {
                flex-direction: row;
                justify-content: center;
            }

                .input-container input {
                    margin-bottom: 0;
                    margin-right: 10px;
                    flex: 1;
                }

                .input-container button {
                    width: auto;
                }
        }
    </style>
</head>
<body>
    <div class="brand-text">prod.whatis®</div>
    <div class="footer-text">v01.02-01.10.25</div>

    <img src="logo.png" alt="Logo" class="logo">
    <div class="instruction">here u can enter ur code and get ur beat</div>

    <div class="input-container">
        <input type="text" id="codeInput" placeholder="Enter code">
        <button onclick="checkCode()">OK</button>
    </div>

    <div class="socials">
        <a href="https://youtube.com/@wwhatiss?si=RI2H-aE_1BzdZcow" target="_blank">
            <img src="youtube.png" alt="YouTube">
        </a>
        <a href="https://www.instagram.com/prod.whatis?igsh=MW5pY3h4cWtmMXZpbA%3D%3D&utm_source=qr" target="_blank">
            <img src="instagram.png" alt="Instagram">
        </a>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalText"></h2>
            <img id="modalImage" src="" alt="Beat Image">
            <div>
                <button onclick="closeModal()">Close</button>
                <a id="downloadLink" href="#" download>
                    <button>Download</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        async function checkCode() {
            const code = document.getElementById("codeInput").value.trim();
            const res = await fetch("/check?code=" + code);
            if (!res.ok) {
                alert("Invalid code!");
                return;
            }
            const data = await res.json();

            document.getElementById("modalText").textContent = data.text;
            document.getElementById("modalImage").src = data.image || "";
            document.getElementById("downloadLink").href = data.file;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>
</body>
</html>
